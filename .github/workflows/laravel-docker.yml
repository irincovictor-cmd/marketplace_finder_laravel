name: Laravel Docker checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build and launch
        run: docker compose up -d --build
      - name: Wait for Laravel
        run: |
          for i in $(seq 1 90); do
            if docker compose exec -T app php artisan --version >/dev/null 2>&1 && curl -fsS http://127.0.0.1:8000/ >/dev/null 2>&1; then exit 0; fi
            sleep 3
          done
          docker compose logs --tail=120 app
          exit 1
      - name: Verify phone gateway permits browsing but blocks private actions
        run: |
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/browse >/dev/null 2>&1; then break; fi
            sleep 2
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/browse)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/listings)" = "200"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/settings)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/marketplace/api-key)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/marketplace/scan)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X PATCH http://127.0.0.1:8080/listings/1/manual-status)" = "404"
      - name: Verify routes
        run: docker compose exec -T app php artisan route:list
      - name: Lint every PHP file in tracked Laravel overlay
        run: |
          docker compose exec -T app bash -lc 'find /opt/marketplace/laravel-overlay -name "*.php" -type f -print0 | xargs -0 -n1 php -l'
      - name: Run Laravel tests (all HTTP fake, no provider calls)
        run: docker compose exec -T app php artisan test
      - name: Print failure diagnostics
        if: failure()
        run: docker compose logs --tail=120
      - name: Stop containers
        if: always()
        run: docker compose down
