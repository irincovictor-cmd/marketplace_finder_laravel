name: Laravel Docker checks

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - name: Build and launch
        run: docker compose up -d --build
      - name: Wait for Laravel
        run: |
          for i in $(seq 1 90); do
            if docker compose exec -T app php artisan --version >/dev/null 2>&1 && curl -fsS http://127.0.0.1:8000/ >/dev/null 2>&1; then exit 0; fi
            sleep 3
          done
          docker compose logs --tail=120 app
          exit 1
      - name: Verify phone tester gateway supports prototype features and blocks secrets
        run: |
          for i in $(seq 1 20); do
            if curl -fsS http://127.0.0.1:8080/browse >/dev/null 2>&1; then break; fi
            sleep 2
          done
          for route in /browse /browse/saved-items /browse/watchlist /browse/profit-calculator /browse/activity-logs /browse/rejected-listings /browse/availability-history /listings /collections/saved /collections/watchlist /marketplace/scan-plan; do
            test "$(curl -s -o /dev/null -w '%{http_code}' "http://127.0.0.1:8080$route")" = "200"
          done
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/settings)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/browse/settings)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8080/marketplace/api-key)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/marketplace/scan)" = "404"
          test "$(curl -s -o /dev/null -w '%{http_code}' -X POST http://127.0.0.1:8080/marketplace/tester-scan)" = "419"
          if curl -fsS http://127.0.0.1:8080/browse | grep -q 'id="apiKeyInput"'; then
            echo 'ERROR: secret-management form exposed to testers'
            exit 1
          fi
      - name: Verify tester phone form can use session and CSRF for calculator
        run: |
          curl -fsS -c /tmp/guest-cookies http://127.0.0.1:8080/browse > /tmp/tester-dashboard.html
          TOKEN=$(sed -n 's/.*<meta name="csrf-token" content="\([^"]*\)".*/\1/p' /tmp/tester-dashboard.html | head -n 1)
          test -n "$TOKEN"
          CODE=$(curl -s -o /tmp/guest-calc.json -w '%{http_code}' -b /tmp/guest-cookies -c /tmp/guest-cookies \
            -X POST -H "Accept: application/json" -H "Content-Type: application/json" -H "X-CSRF-TOKEN: $TOKEN" \
            --data '{"buying_price":8000,"selling_price":10000,"extra_costs":500}' \
            http://127.0.0.1:8080/calculator/estimate)
          test "$CODE" = "200"
          python3 -c 'import json; x=json.load(open("/tmp/guest-calc.json")); assert x["profit"] == 1500'
      - name: Verify routes
        run: docker compose exec -T app php artisan route:list
      - name: Lint every PHP file in tracked Laravel overlay
        run: |
          docker compose exec -T app bash -lc 'find /opt/marketplace/laravel-overlay -name "*.php" -type f -print0 | xargs -0 -n1 php -l'
      - name: Run Laravel tests (all HTTP fake, no provider calls)
        run: docker compose exec -T app php artisan test
      - name: Print failure diagnostics
        if: failure()
        run: docker compose logs --tail=120
      - name: Stop containers
        if: always()
        run: docker compose down
