server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    client_max_body_size 128k;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control "no-store" always;

    # Explicitly permitted prototype views. All use the same working dashboard
    # but the key-management panel is excluded from tester HTML.
    location = / { return 302 /browse; }

    location ~ ^/browse(?:/(?:saved-items|watchlist|profit-calculator|activity-logs|rejected-listings|availability-history))?$ {
        proxy_pass http://app:8000;
        proxy_set_header Host localhost:8000;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
    }

    # API allowlist for the original features: search, review, collections,
    # calculator, scan preview and a restricted tester-only paid scan.
    # Laravel manages session cookies + CSRF for state-changing requests.
    location ~ ^/(?:listings(?:/rejected|/manual-status-history|/location-audit|/[0-9]+/(?:manual-status|location-review))?|collections/(?:saved(?:/[0-9]+)?|watchlist(?:/[0-9]+(?:/matches)?)?)|calculator/estimate|marketplace/(?:scan-plan|tester-scan))$ {
        proxy_pass http://app:8000;
        proxy_set_header Host localhost:8000;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
    }

    # Fail closed. Explicitly blocks owner /settings and all /marketplace/api-key
    # methods, the unrestricted /marketplace/scan, legacy assets and arbitrary routes.
    location / { return 404; }
}
