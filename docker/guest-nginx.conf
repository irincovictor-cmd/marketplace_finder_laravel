server {
    listen 80 default_server;
    server_name _;
    server_tokens off;
    client_max_body_size 128k;

    add_header X-Content-Type-Options nosniff always;
    add_header X-Frame-Options DENY always;
    add_header Referrer-Policy no-referrer always;
    add_header Cache-Control "no-store" always;

    # Explicitly permitted prototype views. All use the same working dashboard
    # but the key-management panel is excluded from tester HTML.
    location = / { return 302 /browse; }

    location ~ ^/(?:discover|saved-items|watchlist|profit-calculator|activity-logs|rejected-listings|availability-history|settings|demo-access(?:/logout)?)$ {
        proxy_pass http://app:8000;
        proxy_set_header Host localhost:8000;
        proxy_set_header X-Marketplace-Demo-Proxy 1;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
    }

    location ~ ^/browse(?:/(?:saved-items|watchlist|profit-calculator|activity-logs|rejected-listings|availability-history))?$ {
        proxy_pass http://app:8000;
        proxy_set_header Host localhost:8000;
        proxy_set_header X-Marketplace-Demo-Proxy 1;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
    }

    # API allowlist for the original features: search, review, collections,
    # calculator, scan preview and a restricted tester-only paid scan.
    # Laravel manages session cookies + CSRF for state-changing requests.
    location ~ ^/(?:listings(?:/rejected|/manual-status-history|/restore-images|/photo-recovery(?:-candidates)?|/location-audit|/[0-9]+/(?:manual-status|location-review|photo))?|collections/(?:saved(?:/[0-9]+)?|watchlist(?:/[0-9]+(?:/matches)?)?)|calculator/estimate|marketplace/(?:scan-plan|tester-scan|tester-connection|scan|api-key(?:/test)?))$ {
        proxy_pass http://app:8000;
        proxy_set_header Host localhost:8000;
        proxy_set_header X-Marketplace-Demo-Proxy 1;
        proxy_set_header X-Forwarded-For $remote_addr;
        proxy_set_header X-Forwarded-Proto http;
    }

    # Owner routes are guarded by Laravel remote access middleware; all other routes fail closed.
    location / { return 404; }
}
