services:
  app:
    build:
      context: .
      dockerfile: docker/php/Dockerfile
    working_dir: /var/www/html
    volumes:
      - ./laravel:/var/www/html
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      # Do not override APP_ENV: PHPUnit must be able to set APP_ENV=testing.
      DB_CONNECTION: sqlite
      COMPOSER_ALLOW_SUPERUSER: "1"
    command: ["bash", "/opt/marketplace/bootstrap.sh"]
    healthcheck:
      test: ["CMD-SHELL", "curl -fsS http://127.0.0.1:8000/ >/dev/null || exit 1"]
      interval: 15s
      timeout: 5s
      retries: 12
      start_period: 180s
    restart: unless-stopped

  frontend:
    image: node:24-bookworm-slim
    working_dir: /var/www/html
    volumes:
      - ./laravel:/var/www/html
      - ./docker/node-bootstrap.sh:/opt/marketplace/node-bootstrap.sh:ro
    # Vite stays on the internal Docker network; no Windows port forwarding needed.
    # The dashboard currently uses inline CSS/JS and does not need browser HMR.
    command: ["sh", "/opt/marketplace/node-bootstrap.sh"]
    # Avoid implicit paid API calls or background scans.
    depends_on:
      - app
    restart: unless-stopped

  # Read-only mobile site on the PC's LAN IP. Owner dashboard stays loopback-only.
  guest:
    image: nginx:1.27-alpine
    ports:
      - "0.0.0.0:8080:80"
    volumes:
      - ./docker/guest-nginx.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      - app
    restart: unless-stopped
